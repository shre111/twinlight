[tool.uv.workspace]
members = ["py/*", "services/*", "tools/*"]

[dependency-groups]
dev = [
  "httpx2>=2.16,<3",
  "hypothesis>=6.170,<7",
  "pyright==1.1.414",
  "pytest>=9.2,<10",
  "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["twl_*"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["py", "services", "tools"]

[tool.pytest.ini_options]
addopts = ["-ra", "--import-mode=importlib"]
testpaths = ["py", "services", "tools"]
markers = [
  "golden: determinism goldens (tape hashes across worker counts)",
  "anchor: model anchor tests (Bass limit, prototype parity; D-027)",
]
