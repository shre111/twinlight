[project]
name = "twl-runner"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162,<0.163",
  "twl-engine",
  "twl-tape",
  "uvicorn>=0.54,<0.55",
]

[tool.uv.sources]
twl-engine = { workspace = true }
twl-tape = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
