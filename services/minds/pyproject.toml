[project]
name = "twl-minds"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "numpy>=2.5,<3",
    "pydantic>=2,<3",
    "twl-pack",
    "uvicorn>=0.54,<0.55",
]

[tool.uv.sources]
twl-pack = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
