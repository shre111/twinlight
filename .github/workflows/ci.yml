name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      engine: ${{ steps.filter.outputs.engine }}
      python: ${{ steps.filter.outputs.python }}
      formats: ${{ steps.filter.outputs.formats }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            node: &node
              - *workflow
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'biome.json'
              - '.nvmrc'
            uv: &uv
              - *workflow
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            web:
              - *node
              - 'apps/**'
              - 'packages/**'
              - 'design/tokens.json'
            engine:
              - *uv
              - 'py/**'
              - 'services/runner/**'
              - 'fixtures/**'
            python:
              - *uv
              - 'py/pack/**'
              - 'services/minds/**'
              - 'tools/**'
            formats:
              - *node
              - *uv
              - 'py/tape/**'
              - 'packages/tape/**'
              - 'fixtures/tape/**'
              - 'py/pack/**'
              - 'packages/stage/src/**'
              - 'packages/stage/test/pack-golden.test.ts'
              - 'fixtures/pack/**'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm turbo run typecheck test

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    env:
      TWL_GOLDEN_STRICT: '1'
      NUMBA_CACHE_DIR: .numba-cache
      NPY_ENABLE_CPU_FEATURES: X86_V3
      NUMBA_CPU_NAME: generic
      NUMBA_DISABLE_INTEL_SVML: '1'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: .numba-cache
          key: numba-${{ runner.os }}-${{ hashFiles('uv.lock', 'py/engine/**/*.py') }}
      - run: uv sync --frozen
      - run: uv run python -c "import numpy; numpy.show_runtime()"
      - run: uv run ruff format --check py services/runner
      - run: uv run ruff check py services/runner
      - run: uv run pyright py services/runner
      - run: uv run pytest -q py services/runner

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [services/minds, tools/citybake]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check ${{ matrix.project }}
      - run: uv run ruff check ${{ matrix.project }}
      - run: uv run pyright ${{ matrix.project }}
      - run: uv run pytest -q ${{ matrix.project }}

  cross-language-goldens:
    needs: changes
    if: needs.changes.outputs.formats == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run python -m twl_tape.fixtures --check
      - run: pnpm -F @twinlight/tape test
      - run: pnpm -F @twinlight/stage exec vitest run test/pack-golden.test.ts

  ci-ok:
    needs: [changes, web, engine, python, cross-language-goldens]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all required jobs passed or were skipped"
