slug = "ahmedabad"
name = "Ahmedabad"
# west, south, east, north in degrees (WGS84): the municipal corporation plus its western suburbs
bbox = [72.45, 22.92, 72.72, 23.14]
# root of every citybake random stream
seed = 20260101

[osm]
url = "https://download.geofabrik.de/asia/india/western-zone-260101.osm.pbf"
md5 = "d62746c49b4ba9277e1e6de4b5afad70"

[river]
# waterway=river centreline names that split the city into banks
names = ["Sabarmati River", "Sabarmati"]

[districts]
place_kinds = ["suburb", "neighbourhood", "quarter", "village", "town"]
# Vatva railway station; no place node in OSM
extra_seeds = [{ name = "Vatva", node = 4398457021 }]
# two spellings of one place: the key's buildings and area join the target district
merge = { "Koteshwar Village" = "Koteshwar" }
# display names, applied after merges; the two Ramol/Jantanagar nodes are 2.85 km apart, so they stay
# separate districts named for the locality each one sits in
rename = { "Ramol -Jantanagar" = "Ramol", "Jantanagar -Ramol" = "Jantanagar", "vejalpur" = "Vejalpur", "DaniLimda" = "Danilimda", "Narol gam" = "Narol" }

[footprints]
# D-021: VIDA's combined Google + Microsoft + OSM footprints, S2 level-6 cell over the city
vida_url = "https://data.source.coop/vida/google-microsoft-osm-open-buildings/geoparquet/by_country_s2/country_iso=IND/4134022982949404672.parquet"
vida_etag = "\"d4fb270fd5ebbc6db795b886a3a213f6-84\""
# date of VIDA's snapshot, which fixes the licence of its Microsoft rows (ODbL then)
vida_snapshot = "2024-08-27"
heights_manifest = "https://storage.googleapis.com/open-buildings-temporal-data/v1/manifests/39_EPSG_32643_2023_06_30.json"
# drop a footprint when more than this share of its area overlaps higher-priority ones
overlap_drop = 0.3
# 2.5D pixels below this are ground
raster_min_height_m = 1.0
raster_cell_m = 4.0

[population_raster]
# D-025: 2025 epoch, 3 arcsec, EPSG:4326, one 10 degree tile; no population_total, because its 8.08M
# in the bbox already matches the city
url = "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_4326_3ss/V1-0/tiles/GHS_POP_E2025_GLOBE_R2023A_4326_3ss_V1_0_R7_C26.zip"
md5 = "15cc4641a1ac01352f09a7d9cccadcfe"
member = "GHS_POP_E2025_GLOBE_R2023A_4326_3ss_V1_0_R7_C26.tif"
source = "GHS-POP R2023A, 2025 epoch (© European Union, JRC)"
licence = "CC BY 4.0"

[population_correction]
# D-030: each raster cell becomes raster^(1-w) * fit^w. 0.75 sits in the lower part of the range that passes
# the ward checks on the real step, and is not an optimum. The range's low edge rests on the rough north-west
# box band: 0.71 clears it by 391 people. Minimising spread across all 48 wards assumes equal growth, so it
# likely understates the north-west. Revisit when AMC's ward-wise 2011 file or Census 2027 ward data arrives.
# A new city states its own weight and evidence.
weight = 0.75
weight_range = [0.71, 0.83]
weight_evidence = "Stated by the owner after seeing the 48 ward polygons: in the lower part of the range that passes the ward checks on the real step, not an optimum and not chosen by code. GHS-POP alone gives the north-west five wards a mean of 0.32 of a 2011 ward."
# fit is taken from Asarva, Maninagar, Sabarmati, Vatva and Vejalpur talukas, applied everywhere
reference_polygons = ["relation/16736466", "relation/16736464", "relation/16736468", "relation/16736465", "relation/16736469"]
# floor-area-weighted floors and footprint m2, and footprint share of the cell
height_edges = [2.0, 3.0, 5.0, 8.0]
footprint_edges = [100.0, 250.0, 600.0, 1500.0]
coverage_edges = [0.10, 0.25, 0.45]
# a class rate above 1 person per this much housing floor is capped there
fit_min_m2_per_person = 8.0
# a class under this share of reference housing floor uses the reference rate
min_class_share = 0.002

[population_check]
# validation only: never in a stage table, layer.json's attribution or a pack; report.json credits it
url = "https://raw.githubusercontent.com/datameet/Municipal_Spatial_Data/46679b9c173e4f13745974134c3802f92d80bf8f/Ahmedabad/Wards.geojson"
md5 = "165e7dcd6710c7525b8ea169ca5cdeed"
source = "Ward polygons: DataMeet Municipal_Spatial_Data, Ahmedabad/Wards.geojson, commit 46679b9c, CC BY-SA 2.5 IN"
name_property = "Name"
# wards were drawn to hold about this many people each in 2011, plus or minus 10%
ward_people_2011 = 118001
total_people_2011 = 5664062
total_growth = [1.27, 1.6]

[[population_check.ward_groups]]
name = "walled city"
wards = ["DARIYAPUR", "JAMALPUR", "KHADIA", "SHAHPUR"]
mean_ratio = [0.75, 1.25]
ward_ratio = [0.75, 1.25]
known_misses = ["DARIYAPUR"]

[[population_check.ward_groups]]
name = "north-west five"
wards = ["GOTA", "CHANDLODIA", "GHATLODIA", "THALTEJ", "BODAKDEV"]

[[population_check.regions]]
name = "Ghatlodiya taluka"
polygon = "relation/16736467"
people = [405000, 830000]

[[population_check.regions]]
name = "north-west box"
# local metres x0, y0, x1, y1
box = [-20000.0, 0.0, -3000.0, 20000.0]
people = [970000, 1420000]

[[population_check.regions]]
name = "Daskroi part in the bbox"
polygon = "relation/9661743"
people = [0, 409000]

[population]
# densest plausible crowding: a capacity ceiling, not a typical value
min_floor_m2_per_person = 4.0
adult_share = 0.69
adult_share_source = "Census of India 2011, C-14, Ahmadabad district urban, 18+ of stated ages"
residents = 100000
# adults the agents stand for: about 1.5M quick-commerce shoppers; calibration moves it (P-062)
shopper_share = 0.27

[population.residential_share]
# share of floor area that is housing, by building kind
unknown = 0.9
residential = 1.0
commercial = 0.2
industrial = 0.05
civic = 0.1
religious = 0.0
other = 0.0

[households]
source = "Census of India 2011, HH-01, Ahmadabad City sub-district"
# representative sizes of the bins 1..6, 7-10, 11-14, 15+
sizes = [1, 2, 3, 4, 5, 6, 8, 12, 17]
counts = [37094, 97013, 176374, 310595, 229831, 143502, 158773, 18359, 4216]
# scales the 2011 mean size for 2025 households; 1.0 keeps the census
size_shrink = 1.0

[personas]
# Nemotron-Personas-India dataset commit; the source spells the district "Ahmadabad"
revision = "adefeefcc0fc3f85726d20bed0e4ed8d66372a54"
state = "Gujarat"
district = "Ahmadabad"
no_occupation = "No Occupation / Retired / Homemaker"
married = "Currently Married"
# D-026: first match wins; bump the version when a rule changes
segments_version = 1

[[personas.segments]]
name = "senior"
min_age = 60

[[personas.segments]]
name = "young_single"
max_age = 29
marital = ["Never Married"]

[[personas.segments]]
name = "homemaker"
sex = "Female"
occupied = false

[[personas.segments]]
name = "working_graduate"
occupied = true
education = ["Graduate & above", "Technical diploma or certificate not equal to degree"]

[[personas.segments]]
name = "working_other"
occupied = true

[[personas.segments]]
name = "other_adult"

[graph]
# mean ties per resident; residents are a cluster sample, so ties are thin in space
neighbour_degree = 1.6
neighbour_scale_m = 250.0
# nearest residents considered
neighbour_candidates = 64
friend_degree = 1.2
friend_scale_m = 3000.0
# odds multiplier for a same-segment friend
friend_homophily = 4.0
# random candidates per draw
friend_candidates = 16
# per occupied resident
work_degree = 1.0
# home to workplace decay
work_scale_m = 5000.0
# co-workers share a workplace cell
work_cell_m = 500.0
workplace_candidates = 16
# untagged footprints this big and at most workplace_max_floors tall count as workplaces (sheds, factories)
workplace_min_area_m2 = 1000.0
workplace_max_floors = 3

[graph.targets]
mean_degree = [5.0, 8.0]
# average local clustering, all ties
clustering = [0.10, 0.50]
cross_river_non_household = [0.05, 0.25]
largest_component_min = 0.95
isolated_max = 0.02

[stores]
# delivery radius
radius_m = 2500.0
# stop placing once this share of residents is within a radius
coverage_target = 0.92
max_stores = 80
# candidates are road nodes, at most one per grid cell
candidate_cell_m = 500.0

[travel]
h3_resolution = 9
# two-wheeler km/h by road class at a band factor of 1
# bands and speeds are assumptions until the owner's hand check against Google Maps (D-022)
speed_kmh = { major = 40.0, primary = 30.0, secondary = 26.0, tertiary = 22.0, local = 16.0, service = 12.0 }

[[travel.bands]]
name = "night"
# minute of day; 22:00 to 08:00, wraps midnight
start_minute = 1320
factor = 1.25

[[travel.bands]]
name = "morning_peak"
# 08:00
start_minute = 480
factor = 0.8

[[travel.bands]]
name = "midday"
# 11:00
start_minute = 660
factor = 1.0

[[travel.bands]]
name = "evening_peak"
# 17:00
start_minute = 1020
factor = 0.7
