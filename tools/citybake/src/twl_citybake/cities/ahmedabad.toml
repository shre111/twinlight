slug = "ahmedabad"
name = "Ahmedabad"
# west, south, east, north in degrees (WGS84): the municipal corporation plus its western suburbs
bbox = [72.45, 22.92, 72.72, 23.14]
# root of every citybake random stream
seed = 20260101

[osm]
url = "https://download.geofabrik.de/asia/india/western-zone-260101.osm.pbf"
md5 = "d62746c49b4ba9277e1e6de4b5afad70"

[river]
# waterway=river centreline names that split the city into banks
names = ["Sabarmati River", "Sabarmati"]

[districts]
place_kinds = ["suburb", "neighbourhood", "quarter", "village", "town"]
# Vatva railway station; no place node in OSM
extra_seeds = [{ name = "Vatva", node = 4398457021 }]
# two spellings of one place: the key's buildings and area join the target district
merge = { "Koteshwar Village" = "Koteshwar" }
# display names, applied after merges; the two Ramol/Jantanagar nodes are 2.85 km apart, so they stay
# separate districts named for the locality each one sits in
rename = { "Ramol -Jantanagar" = "Ramol", "Jantanagar -Ramol" = "Jantanagar", "vejalpur" = "Vejalpur", "DaniLimda" = "Danilimda", "Narol gam" = "Narol" }

[footprints]
# D-021: VIDA's combined Google + Microsoft + OSM footprints, S2 level-6 cell over the city
vida_url = "https://data.source.coop/vida/google-microsoft-osm-open-buildings/geoparquet/by_country_s2/country_iso=IND/4134022982949404672.parquet"
vida_etag = "\"d4fb270fd5ebbc6db795b886a3a213f6-84\""
# date of VIDA's snapshot, which fixes the licence of its Microsoft rows (ODbL then)
vida_snapshot = "2024-08-27"
heights_manifest = "https://storage.googleapis.com/open-buildings-temporal-data/v1/manifests/39_EPSG_32643_2023_06_30.json"
# drop a footprint when more than this share of its area overlaps higher-priority ones
overlap_drop = 0.3
# 2.5D pixels below this are ground
raster_min_height_m = 1.0
raster_cell_m = 4.0

[worldpop]
# R2025A 2025 constrained 100 m, persons per cell
url = "https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/2025/IND/v1/100m/constrained/ind_pop_2025_CN_100m_R2025A_v1.tif"
md5 = "89905eed942228829cf21eee28eb12df"

[population]
# densest plausible crowding: a capacity ceiling, not a typical value
min_floor_m2_per_person = 4.0
adult_share = 0.69
adult_share_source = "Census of India 2011, C-14, Ahmadabad district urban, 18+ of stated ages"
residents = 100000
# adults the agents stand for: about 1.6M quick-commerce shoppers; calibration moves it (P-062)
shopper_share = 0.27

[population.residential_share]
# share of floor area that is housing, by building kind
unknown = 0.9
residential = 1.0
commercial = 0.2
industrial = 0.05
civic = 0.1
religious = 0.0
other = 0.0

[households]
source = "Census of India 2011, HH-01, Ahmadabad City sub-district"
# representative sizes of the bins 1..6, 7-10, 11-14, 15+
sizes = [1, 2, 3, 4, 5, 6, 8, 12, 17]
counts = [37094, 97013, 176374, 310595, 229831, 143502, 158773, 18359, 4216]
# scales the 2011 mean size for 2025 households; 1.0 keeps the census
size_shrink = 1.0
