[project]
name = "twl-citybake"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5,<3",
    "osmium>=4.3,<5",
    "pyproj>=3.8,<4",
    "scipy>=1.18,<2",
    "shapely>=2.2,<3",
]

[project.scripts]
citybake = "twl_citybake.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
