<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interview on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@300;500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#0F1330}
a{color:#A6F0DA}a:hover{color:#EEF0FB}
button:focus-visible,a:focus-visible{outline:2px solid #FFB547;outline-offset:3px}
@keyframes twl-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.twl-live span{animation:twl-wave 1.1s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion: reduce){.twl-live span{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0F1330; color: #EEF0FB; font-family: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid #2A3166">
    <a href="PhoneResident.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 8px; border-radius: 999px; color: #EEF0FB; text-decoration: none; font-size: 14px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#EEF0FB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg>
      Ritu's month
    </a>
    <button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #2A3166; background: transparent; color: #EEF0FB; font: inherit; font-size: 14px; cursor: pointer">End interview</button>
  </header>

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px">
    <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 999px; background: #171C42; border: 1px solid #2A3166; display: grid; place-items: center">
      <span style="width: 12px; height: 9px; border-radius: 2px; background: #FFD48A; box-shadow: 0 0 14px 4px rgba(255,181,71,0.45)"></span>
    </span>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Big Shoulders', 'Arial Narrow', sans-serif; font-weight: 500; font-size: 22px; line-height: 1">Ritu Desai</span>
      <span style="font-size: 13px; color: #9AA3CF">27, Vastrapur. Answers in Gujarati or English.</span>
    </span>
  </div>

  <section aria-label="Transcript" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 6px 20px 16px">
    <sc-for list="{{turns}}" as="t" hint-placeholder-count="4">
      <div style="{{t.wrap}}">
        <p style="{{t.bubble}}">{{t.text}}</p>
        <sc-if value="{{t.hasCites}}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{t.cites}}" as="c" hint-placeholder-count="2">
              <a href="PhoneCity.dc.html" style="{{c.style}}">{{c.label}}</a>
            </sc-for>
          </span>
        </sc-if>
      </div>
    </sc-for>
  </section>

  <footer style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 20px 22px; background: #171C42; border-top: 1px solid #2A3166">
    <div aria-hidden="true" class="{{waveClass}}" style="display: flex; align-items: center; gap: 4px; height: 34px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="24">
        <span style="{{b.style}}"></span>
      </sc-for>
    </div>
    <p aria-live="polite" style="margin: 0; font-size: 14px; color: #9AA3CF">{{status}}</p>
    <button aria-pressed="{{listening}}" aria-label="{{micLabel}}" onClick="{{toggle}}" style="{{micStyle}}">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 18 18" fill="none" stroke="#0F1330" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="2" width="6" height="9" rx="3"></rect><path d="M3.5 8.5a5.5 5.5 0 0 0 11 0M9 14v2.5"></path></svg>
    </button>
    <a href="#" style="font-size: 14px">Type a question instead</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { listening: true };
  }
  renderVals() {
    const cite = (label, kind) => ({
      label,
      style: 'display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; text-decoration: none; ' + (kind === 'red' ? 'background: rgba(255,84,104,0.14); color: #FF8A97; border: 1px solid rgba(255,84,104,0.4)' : kind === 'blue' ? 'background: rgba(111,140,201,0.18); color: #A9BDE6; border: 1px solid rgba(111,140,201,0.45)' : kind === 'amber' ? 'background: rgba(255,181,71,0.14); color: #FFB547; border: 1px solid rgba(255,181,71,0.4)' : 'background: rgba(200,182,255,0.14); color: #C8B6FF; border: 1px solid rgba(200,182,255,0.35)')
    });
    const you = (text) => ({ text, hasCites: false, cites: [], wrap: 'display: flex; justify-content: flex-end', bubble: 'margin: 0; max-width: 78%; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: #2A3166; font-size: 15px; line-height: 1.45' });
    const her = (text, cites) => ({ text, hasCites: true, cites, wrap: 'display: flex; flex-direction: column; align-items: flex-start; gap: 8px', bubble: 'margin: 0; max-width: 90%; padding: 12px 14px; border-radius: 16px 16px 16px 4px; background: #171C42; border: 1px solid #2A3166; font-size: 15px; line-height: 1.5' });
    const turns = [
      you('Why did you order less after day 10?'),
      her("I didn't stop, I stopped trusting it at night. The Vastrapur store was empty when I tried, and on day 13 it was raining and the app said 31 minutes, so I made chaas at home.", [cite('Day 10, Store 11 empty', 'red'), cite('Day 13, 31 minute quote', 'blue')]),
      you('What would make you order it every week?'),
      her("If it's always there after dinner. ₹49 is fine for one. My parents liked it, but they'd want it less sweet.", [cite('Day 21, ordered for parents', 'amber'), cite('Her answers before launch', 'lilac')])
    ];
    const heights = [10, 18, 26, 14, 30, 22, 12, 28, 34, 20, 16, 26, 32, 18, 24, 14, 30, 22, 12, 20, 28, 16, 10, 18];
    const listening = this.state.listening;
    const bars = heights.map((h, i) => ({ style: 'display: block; width: 4px; border-radius: 2px; height: ' + (listening ? h : 4) + 'px; background: ' + (listening ? '#FFB547' : '#2A3166') + '; animation-delay: ' + (i * 0.05).toFixed(2) + 's' }));
    return {
      turns,
      bars,
      listening,
      waveClass: listening ? 'twl-live' : '',
      status: listening ? 'Listening. Tap to stop.' : 'Tap to ask Ritu something.',
      micLabel: listening ? 'Stop listening' : 'Start speaking',
      micStyle: 'width: 68px; height: 68px; border-radius: 999px; border: 0; cursor: pointer; display: grid; place-items: center; background: #FFB547; ' + (listening ? 'box-shadow: 0 0 0 8px rgba(255,181,71,0.18), 0 0 0 16px rgba(255,181,71,0.08)' : 'box-shadow: none'),
      toggle: () => this.setState({ listening: !listening })
    };
  }
}
</script>
</body>
</html>
