<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resident on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@300;500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#0F1330}
a{color:#A6F0DA}a:hover{color:#EEF0FB}
button:focus-visible,a:focus-visible{outline:2px solid #FFB547;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0F1330; color: #EEF0FB; font-family: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">
  <svg role="img" aria-label="Ritu's building at night with her window lit amber" viewBox="0 0 390 250" style="display: block; width: 390px; height: 250px">
    <rect x="0" y="0" width="390" height="250" fill="#0F1330"></rect>
    <sc-for list="{{facade.blocks}}" as="b" hint-placeholder-count="5">
      <rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" fill="{{b.fill}}"></rect>
    </sc-for>
    <sc-for list="{{facade.windows}}" as="w" hint-placeholder-count="80">
      <rect x="{{w.x}}" y="{{w.y}}" width="9" height="6" rx="1" fill="{{w.c}}" opacity="{{w.o}}"></rect>
    </sc-for>
    <circle cx="{{facade.hx}}" cy="{{facade.hy}}" r="24" fill="#FFB547" opacity="0.16"></circle>
    <circle cx="{{facade.hx}}" cy="{{facade.hy}}" r="15" fill="none" stroke="#FFB547" stroke-width="1.5"></circle>
    <rect x="{{facade.wx}}" y="{{facade.wy}}" width="11" height="8" rx="1" fill="#FFD48A"></rect>
  </svg>

  <a href="PhoneCity.dc.html" style="position: absolute; top: 16px; left: 16px; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(23,28,66,0.86); border: 1px solid #2A3166; color: #EEF0FB; text-decoration: none; font-size: 14px">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#EEF0FB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg>
    City
  </a>

  <div style="position: absolute; top: 184px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 112px; background: #171C42; border-top: 1px solid #2A3166; border-radius: 18px 18px 0 0; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders', 'Arial Narrow', sans-serif; font-weight: 500; font-size: 36px; line-height: 1.05">Ritu Desai</h1>
      <p style="margin: 0; font-size: 15px; color: #9AA3CF">27, Vastrapur, lives with her parents</p>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="padding: 5px 12px; border-radius: 999px; font-size: 13px; background: rgba(255,181,71,0.16); color: #FFB547; border: 1px solid rgba(255,181,71,0.45)">Ordered 3 times</span>
      <span style="padding: 5px 12px; border-radius: 999px; font-size: 13px; background: rgba(200,182,255,0.14); color: #C8B6FF; border: 1px solid rgba(200,182,255,0.35)">Told 2 people, 1 ordered</span>
    </div>
    <ol aria-label="Her month" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
      <sc-for list="{{events}}" as="e" hint-placeholder-count="6">
        <li style="display: grid; grid-template-columns: 18px 1fr; column-gap: 12px">
          <span aria-hidden="true" style="display: flex; flex-direction: column; align-items: center">
            <span style="{{e.dot}}"></span>
            <span style="flex: 1; width: 1px; background: #2A3166"></span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px">
            <span style="font-size: 12px; color: #9AA3CF; font-variant-numeric: tabular-nums">{{e.when}}</span>
            <span style="font-size: 15px; line-height: 1.4">{{e.text}}</span>
          </span>
        </li>
      </sc-for>
    </ol>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 20px; background: #171C42; border-top: 1px solid #2A3166">
    <a href="PhoneInterview.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 999px; background: #FFB547; color: #0F1330; text-decoration: none; font-size: 17px; font-weight: 700">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#0F1330" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="2" width="6" height="9" rx="3"></rect><path d="M3.5 8.5a5.5 5.5 0 0 0 11 0M9 14v2.5"></path></svg>
      Interview Ritu
    </a>
    <p style="margin: 0; font-size: 12px; line-height: 1.4; color: #9AA3CF; text-align: center">Ritu is synthetic, built from census-aligned data.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let seed = 11;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const blocks = [
      { x: 0, y: 90, w: 70, h: 160, fill: '#141938' },
      { x: 70, y: 40, w: 110, h: 210, fill: '#1B2150' },
      { x: 180, y: 12, w: 130, h: 238, fill: '#1E2558' },
      { x: 310, y: 70, w: 80, h: 180, fill: '#161B40' }
    ];
    const windows = [];
    let hx = 0, hy = 0, wx = 0, wy = 0;
    blocks.forEach((b, bi) => {
      for (let y = b.y + 14; y < 240; y += 14) {
        for (let x = b.x + 8; x < b.x + b.w - 12; x += 15) {
          const roll = rnd();
          if (bi === 2 && Math.abs(y - 124) < 1 && Math.abs(x - 248) < 8) { wx = x - 1; wy = y - 1; hx = x + 4.5; hy = y + 3; continue; }
          if (roll < 0.55) continue;
          const kind = rnd();
          const c = kind < 0.12 ? '#FFB547' : kind < 0.3 ? '#C8B6FF' : '#A6F0DA';
          const o = c === '#A6F0DA' ? 0.18 + rnd() * 0.15 : c === '#C8B6FF' ? 0.45 : 0.85;
          windows.push({ x, y, c, o });
        }
      }
    });
    const dot = (c, ring) => 'width: 12px; height: 12px; margin-top: 3px; border-radius: 999px; flex: none; ' + (ring ? 'background: transparent; border: 2px solid ' + c + '; box-sizing: border-box' : 'background: ' + c);
    const events = [
      { when: 'Day 4, 9:10 pm', text: 'Heard about it from Meera, a college friend.', dot: dot('#C8B6FF') },
      { when: 'Day 6, 8:40 pm', text: 'First order, from Store 11 in Vastrapur. Arrived in 12 minutes.', dot: dot('#FFB547') },
      { when: 'Day 10, 9:05 pm', text: 'Store 11 was out of stock. She waited a day.', dot: dot('#FF5468', true) },
      { when: 'Day 11, 7:50 pm', text: 'Ordered again, sent from Store 03 in Satellite. Arrived in 19 minutes.', dot: dot('#FFB547') },
      { when: 'Day 13, 8:30 pm', text: 'Raining. The app quoted 31 minutes, so she skipped it.', dot: dot('#6F8CC9', true) },
      { when: 'Day 21, 6:15 pm', text: 'Third order, two bottles for her parents too.', dot: dot('#FFB547') }
    ];
    return { facade: { blocks, windows, hx, hy, wx, wy }, events };
  }
}
</script>
</body>
</html>
