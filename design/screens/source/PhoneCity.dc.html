<x-dc>

      <a href="Landing.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #EEF0FB">

      <span style="align-self: flex-start; padding: 5px 11px; border-radius: 999px; font-size: 12px; background: rgba(23,28,66,0.86); border: 1px solid #2A3166">Mango lassi, ₹49</span>

    </span>
  </a>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 150px; display: flex; justify-content: space-between; gap: 10px">
    <button style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A3166; background: rgba(23,28,66,0.86); color: #EEF0FB; font: inherit; font-size: 13px; cursor: pointer">

      <button aria-label="Play" style="width: 44px; height: 44px; flex: none; border-radius: 999px; border: 0; background: #FFB547; cursor: pointer; display: grid; place-items: center">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="#0F1330"></path></svg>
      </button>
      <span style="flex: 1; font-size: 15px; font-variant-numeric: tabular-nums">Day 6, 8:40 pm</span>
      <button aria-label="Speed, 4 times" style="height: 36px; min-width: 52px; padding: 0 12px; border-radius: 999px; border: 1px solid #2A3166; background: transparent; color: #EEF0FB; font: inherit; font-size: 13px; cursor: pointer">4×</button>
    </div>
    <div style="position: relative; height: 46px">
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 14px; font-size: 11px; color: #C8B6FF">
        <span style="position: absolute; left: 2%">Ad</span>
        <span style="position: absolute; left: 25%">Creators</span>
        <span style="position: absolute; left: 40%; color: #A9BDE6">Rain</span>
      </div>

        <path d="M0 18 L40 17.4 L80 15.6 L82 15.4 L82 18 Z" fill="#FFB547" opacity="0.5"></path>
        <rect x="0" y="17" width="358" height="2" fill="#2A3166"></rect>
        <rect x="0" y="17" width="82" height="2" fill="#FFB547"></rect>
        <rect x="112" y="13" width="3" height="9" rx="1" fill="#FF5468"></rect>
        <rect x="118" y="13" width="3" height="9" rx="1" fill="#FF5468"></rect>
        <rect x="124" y="13" width="3" height="9" rx="1" fill="#FF5468"></rect>
        <circle cx="82" cy="18" r="7" fill="#EEF0FB" stroke="#0F1330" stroke-width="3"></circle>
        <text x="0" y="30" fill="#9AA3CF" font-size="8" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">Launch</text>
        <text x="119" y="30" text-anchor="middle" fill="#9AA3CF" font-size="8" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">Day 10</text>
        <text x="239" y="30" text-anchor="middle" fill="#9AA3CF" font-size="8" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">Day 20</text>
        <text x="358" y="30" text-anchor="end" fill="#9AA3CF" font-size="8" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">Day 30</text>
      </svg>
    </div>
  </footer>
</div>
